name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build / node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install npm deps (purs, spago, purs-tidy)
        run: npm ci

      - name: Verify pinned tool versions
        run: |
          npx purs --version
          npx spago --version
          npx purs-tidy --version

      - name: Format check
        run: npx purs-tidy check rio-aff rio-fiber rio-aff-config-file rio-aff-http rio-aff-node rio-aff-otel rio-aff-postgres rio-aff-postgres-json rio-aff-postgres-migrate rio-fiber-config-file rio-fiber-http rio-fiber-node rio-fiber-otel rio-fiber-postgres rio-fiber-postgres-json rio-fiber-postgres-migrate spikes examples benchmarks

      - name: Build (rio-aff core)
        run: npx spago build -p rio-aff

      - name: Build (rio-fiber core)
        run: npx spago build -p rio-fiber

      # `spago test -p <pkg>` invokes `purs graph` across the entire workspace,
      # so every workspace sibling's transitive deps must be present in
      # .spago/p before the test step runs. Fetch them all upfront.
      - name: Fetch deps for all workspace packages
        run: |
          for p in rio-aff rio-fiber \
                   rio-aff-config-file rio-aff-http rio-aff-node rio-aff-otel \
                   rio-aff-postgres rio-aff-postgres-json rio-aff-postgres-migrate \
                   rio-fiber-config-file rio-fiber-http rio-fiber-node rio-fiber-otel \
                   rio-fiber-postgres rio-fiber-postgres-json rio-fiber-postgres-migrate; do
            npx spago install -p "$p"
          done

      - name: Test (rio-aff core)
        run: npx spago test -p rio-aff

      - name: Test (rio-fiber core)
        run: npx spago test -p rio-fiber

      - name: Build (spike-row-inference)
        run: npx spago build -p spike-row-inference

      - name: Build (spike-aff-interruption)
        run: npx spago build -p spike-aff-interruption

      - name: Build (spike-phase-2-review)
        run: npx spago build -p spike-phase-2-review

      - name: Build (spike-phase-4-review)
        run: npx spago build -p spike-phase-4-review

      - name: Build (spike-phase-5-review)
        run: npx spago build -p spike-phase-5-review

      - name: Build (spike-phase-6-review)
        run: npx spago build -p spike-phase-6-review

      - name: Build (spike-phase-7-review)
        run: npx spago build -p spike-phase-7-review

      - name: Build (spike-phase-9-review)
        run: npx spago build -p spike-phase-9-review

      - name: Build (spike-qualified-do)
        run: npx spago build -p spike-qualified-do

      - name: Run spike-aff-interruption harness
        run: npx spago run -p spike-aff-interruption

      - name: Run spike-phase-4-review stress test
        run: npx spago run -p spike-phase-4-review

      - name: Run spike-phase-5-review layered app
        run: npx spago run -p spike-phase-5-review

      - name: Run spike-phase-6-review stress test
        run: npx spago run -p spike-phase-6-review

      - name: Run spike-phase-7-review test-helpers app
        run: npx spago run -p spike-phase-7-review

      - name: Run spike-phase-9-review stress test
        run: npx spago run -p spike-phase-9-review

      - name: Run spike-qualified-do demonstrations
        run: npx spago run -p spike-qualified-do

      - name: Build and run logger example
        run: npx spago run -p rio-example-logger

      - name: Build rio-aff-http adapter
        run: npx spago build -p rio-aff-http

      - name: Test rio-aff-http adapter
        run: npx spago test -p rio-aff-http

      - name: Build rio-fiber-http adapter
        run: npx spago build -p rio-fiber-http

      - name: Test rio-fiber-http adapter
        run: npx spago test -p rio-fiber-http

      - name: Build rio-aff-node adapter
        run: npx spago build -p rio-aff-node

      - name: Test rio-aff-node adapter
        run: npx spago test -p rio-aff-node

      - name: Build rio-fiber-node adapter
        run: npx spago build -p rio-fiber-node

      - name: Test rio-fiber-node adapter
        run: npx spago test -p rio-fiber-node

      - name: Build rio-aff-config-file adapter
        run: npx spago build -p rio-aff-config-file

      - name: Test rio-aff-config-file adapter
        run: npx spago test -p rio-aff-config-file

      - name: Build rio-fiber-config-file adapter
        run: npx spago build -p rio-fiber-config-file

      - name: Test rio-fiber-config-file adapter
        run: npx spago test -p rio-fiber-config-file

      - name: Build rio-aff-postgres adapter
        run: npx spago build -p rio-aff-postgres

      - name: Build rio-fiber-postgres adapter
        run: npx spago build -p rio-fiber-postgres

      - name: Build rio-aff-postgres-json adapter
        run: npx spago build -p rio-aff-postgres-json

      - name: Build rio-fiber-postgres-json adapter
        run: npx spago build -p rio-fiber-postgres-json

      - name: Build rio-aff-postgres-migrate adapter
        run: npx spago build -p rio-aff-postgres-migrate

      - name: Build rio-fiber-postgres-migrate adapter
        run: npx spago build -p rio-fiber-postgres-migrate

      - name: Build todo-api example
        run: npx spago build -p rio-example-todo-api

      - name: Build rio-aff-otel adapter
        run: npx spago build -p rio-aff-otel

      - name: Test rio-aff-otel adapter
        run: npx spago test -p rio-aff-otel

      - name: Build rio-fiber-otel adapter
        run: npx spago build -p rio-fiber-otel

      - name: Test rio-fiber-otel adapter
        run: npx spago test -p rio-fiber-otel

      - name: Build and run otel-demo example
        run: npx spago run -p rio-example-otel-demo

      - name: Build and run worker-pool example
        run: npx spago run -p rio-example-worker-pool

      - name: Build and run stream-pipeline example
        run: npx spago run -p rio-example-stream-pipeline

      - name: Build and run sink-analytics example
        run: npx spago run -p rio-example-sink-analytics

      - name: Build and run config-loader example
        run: npx spago run -p rio-example-config-loader

      - name: Build batch-import example
        run: npx spago build -p rio-example-batch-import

      - name: Build production-app example
        run: npx spago build -p rio-example-production-app

      - name: Build showcase example
        run: npx spago build -p rio-example-showcase

      - name: Build typed-error-workflow example
        run: npx spago build -p rio-example-typed-error-workflow

      - name: Build benchmark suite (including regression gate)
        run: npx spago build -p rio-benchmarks

      - name: Perf regression gate (informational)
        if: matrix.node == '20'
        continue-on-error: true
        env:
          RIO_GATE_PROFILE: ci-ubuntu-latest
        run: npx spago run -p rio-benchmarks --main Benchmarks.Gate

      - name: Compile-fail tests
        run: bash compile-fail/run.sh

  postgres-integration:
    name: postgres integration / node 20
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rio
          POSTGRES_PASSWORD: rio
          POSTGRES_DB: rio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rio -d rio_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps (purs, spago, purs-tidy, pg)
        run: npm ci

      # `spago test -p <pkg>` invokes `purs graph` across the entire workspace,
      # so every sibling's transitive deps must be present in .spago/p first.
      - name: Fetch deps for all workspace packages
        run: |
          for p in rio-aff rio-fiber \
                   rio-aff-config-file rio-aff-http rio-aff-node rio-aff-otel \
                   rio-aff-postgres rio-aff-postgres-json rio-aff-postgres-migrate \
                   rio-fiber-config-file rio-fiber-http rio-fiber-node rio-fiber-otel \
                   rio-fiber-postgres rio-fiber-postgres-json rio-fiber-postgres-migrate; do
            npx spago install -p "$p"
          done

      - name: Run rio-aff-postgres integration tests
        env:
          PG_CONNECTION_STRING: postgres://rio:rio@localhost:5432/rio_test
        run: npx spago test -p rio-aff-postgres

      - name: Run rio-fiber-postgres integration tests
        env:
          PG_CONNECTION_STRING: postgres://rio:rio@localhost:5432/rio_test
        run: npx spago test -p rio-fiber-postgres

      - name: Run rio-aff-postgres-json integration tests
        env:
          PG_CONNECTION_STRING: postgres://rio:rio@localhost:5432/rio_test
        run: npx spago test -p rio-aff-postgres-json

      - name: Run rio-fiber-postgres-json integration tests
        env:
          PG_CONNECTION_STRING: postgres://rio:rio@localhost:5432/rio_test
        run: npx spago test -p rio-fiber-postgres-json

      - name: Run rio-aff-postgres-migrate integration tests
        env:
          PG_CONNECTION_STRING: postgres://rio:rio@localhost:5432/rio_test
        run: npx spago test -p rio-aff-postgres-migrate

      - name: Run rio-fiber-postgres-migrate integration tests
        env:
          PG_CONNECTION_STRING: postgres://rio:rio@localhost:5432/rio_test
        run: npx spago test -p rio-fiber-postgres-migrate

      - name: Run notify example against the service container
        env:
          DATABASE_URL: postgres://rio:rio@localhost:5432/rio_test
        run: npx spago run -p rio-example-notify
